<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="anGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded tech container -->
  <rect width="40" height="40" rx="9" fill="#0A0E1A" stroke="#312E81" stroke-width="1.2" />
  
  <!-- Outer Tech Hexagon / Shield Frame -->
  <polygon
    points="20,4 35,11.5 35,28.5 20,36 5,28.5 5,11.5"
    fill="url(#shieldGrad)"
    stroke="url(#anGrad)"
    stroke-width="1.6"
    stroke-linejoin="round"
  />

  <!-- Letter 'A' Left Pillar and Crossbar -->
  <path
    d="M 12 28 L 20 11 L 24.5 21"
    stroke="url(#anGrad)"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />
  <path
    d="M 15 22 H 21.5"
    stroke="url(#anGrad)"
    stroke-width="2.2"
    stroke-linecap="round"
  />

  <!-- Letter 'B' / 'N' Right Loop & Vertical Stem -->
  <path
    d="M 23.5 11 V 28"
    stroke="url(#anGrad)"
    stroke-width="2.6"
    stroke-linecap="round"
  />
  <path
    d="M 23.5 12 C 30 12 30 19 23.5 19 C 31 19 31 27.5 23.5 27.5"
    stroke="url(#anGrad)"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Pulsing Cyan Tech Indicator Node -->
  <circle cx="33" cy="33" r="2.5" fill="#22D3EE" />
</svg>